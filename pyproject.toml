[project]
name            = "pyxtrace"
version         = "2.1.0"
description     = "Catch Python performance regressions in CI using deterministic operation counts instead of flaky wall-clock timing."
readme          = "README.md"
authors         = [{ name = "Abhineet Saha", email = "abhineetsaha.2004@gmail.com" }]
license         = { file = "LICENSE" }
requires-python = ">=3.10"

dependencies = [
    "rich>=13.0",
]

keywords = [
    "profiling", "performance", "regression", "regression-testing",
    "ci", "benchmark", "tracing", "profiler", "regression-gate",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Debuggers",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

[project.urls]
Homepage      = "https://github.com/AbhineetSaha/pyxTrace"
Repository    = "https://github.com/AbhineetSaha/pyxTrace"
Issues        = "https://github.com/AbhineetSaha/pyxTrace/issues"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>=7",
]

[project.scripts]
pyxtrace = "pyxtrace.cli:main"

# ---------------- build-system & setuptools bits ----------------
[build-system]
requires      = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where    = ["src"]
include  = ["pyxtrace*"]

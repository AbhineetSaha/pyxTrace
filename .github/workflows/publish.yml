name: publish

# Merge to main → if pyproject.toml's version is not on PyPI yet, the publish job
# waits for a reviewer to approve it in the Actions UI (the `pypi` environment
# requires one), then uploads via trusted publishing. Nothing to do for merges
# that leave the version alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

# read-only by default; the pypi job below asks for exactly what uploading and
# tagging need
permissions:
  contents: read

# one release at a time; a second merge waits instead of racing or cancelling it
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - id: v
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # 404 means not published; anything else but 200 is PyPI being unreachable,
          # which must stop the job rather than look like a version to upload
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pyxtrace/$version/json")
          case "$code" in
            200) new=false ;;
            404) new=true ;;
            *) echo "::error::PyPI answered HTTP $code; cannot tell whether $version is published"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "pyxtrace $version — $([ $new = true ] && echo 'not on PyPI, publish needs approval' || echo 'already on PyPI, nothing to do')"

  pypi:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi   # required reviewer → approve/reject prompt in the Actions UI
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); no token stored anywhere
      contents: write   # to tag the release after a successful upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.x"
      - name: Tests must pass on the commit being released
        run: |
          pip install -e . pytest
          pytest -q
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # passed as data, never pasted into the script
          VERSION: ${{ needs.check.outputs.version }}
        run: gh release create "v$VERSION" --generate-notes --title "v$VERSION"

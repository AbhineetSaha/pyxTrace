name: publish

# Merge to main → if pyproject.toml's version is not on PyPI yet, the publish job
# waits for a reviewer to approve it in the Actions UI (the `pypi` environment
# requires one), then uploads via trusted publishing. Nothing to do for merges
# that leave the version alone.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      new: ${{ steps.v.outputs.new }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          # 404 means not published; anything else but 200 is PyPI being unreachable,
          # which must stop the job rather than look like a version to upload
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/pyxtrace/$version/json")
          case "$code" in
            200) new=false ;;
            404) new=true ;;
            *) echo "::error::PyPI answered HTTP $code; cannot tell whether $version is published"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "pyxtrace $version — $([ $new = true ] && echo 'not on PyPI, publish needs approval' || echo 'already on PyPI, nothing to do')"

  pypi:
    needs: check
    if: needs.check.outputs.new == 'true'
    runs-on: ubuntu-latest
    environment: pypi   # required reviewer → approve/reject prompt in the Actions UI
    permissions:
      id-token: write   # PyPI trusted publishing (OIDC); no token stored anywhere
      contents: write   # to tag the release after a successful upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Tests must pass on the commit being released
        run: |
          pip install -e . pytest
          pytest -q
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Tag and create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ needs.check.outputs.version }}" --generate-notes --title "v${{ needs.check.outputs.version }}"

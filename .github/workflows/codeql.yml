name: CodeQL

# Static security analysis of the Python code and of these workflow files.
# Findings appear under the repository's Security tab → Code scanning.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "27 4 * * 1"   # weekly, so new CodeQL queries reach unchanged code too
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8  # v3.39.1
        with:
          category: /language:${{ matrix.language }}
